<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walid Saheb Ettaba — Documents</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one centered column, sections by category, a grid of document cards with a lightbox */
  :root {
    --paper: #f6f4ef;
    --panel: #ffffff;
    --ink: #1d2430;
    --muted: #6a6f7a;
    --line: #dcd7cc;
    --accent: #1f4e79;
    --thumb: #ebe7de;
    --font: "Segoe UI", Arial, Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15181d; --panel: #1d2128; --ink: #e8e9ec; --muted: #9aa0ab;
      --line: #2e333c; --accent: #8db8e3; --thumb: #252a32; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15181d; --panel: #1d2128; --ink: #e8e9ec; --muted: #9aa0ab;
    --line: #2e333c; --accent: #8db8e3; --thumb: #252a32; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); line-height: 1.5; }
  main {
    max-width: 1080px; margin: 0 auto;
    padding-block: 40px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 40px;
  }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: clamp(1.6rem, 3.4vw, 2.4rem); line-height: 1.1; text-wrap: balance; }
  .meta { margin: 6px 0 0; color: var(--muted); }
  nav { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.92rem; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover, nav a:focus-visible { color: var(--accent); }
  section { display: grid; gap: 16px; scroll-margin-top: 16px; }
  h2 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
  .doc {
    display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; text-align: left; font: inherit; color: inherit;
    padding: 0; cursor: pointer; text-decoration: none; transition: border-color .15s;
  }
  .doc:hover, .doc:focus-visible { border-color: var(--accent); outline: none; }
  .thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--thumb); display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .info { padding: 12px 14px 14px; display: grid; gap: 2px; }
  .info strong { font-size: 0.98rem; }
  .info span { color: var(--muted); font-size: 0.86rem; font-variant-numeric: tabular-nums; }
  footer { color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 18px; }
  dialog { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1100px); max-height: 94vh; }
  dialog::backdrop { background: rgb(10 12 16 / 82%); }
  dialog img { display: block; max-width: 100%; max-height: 86vh; width: auto; margin: 0 auto; border-radius: 4px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 2px; color: #f1f1f1; }
  .bar button { background: none; border: 1px solid #f1f1f1; color: #f1f1f1; border-radius: 4px; padding: 6px 12px; font: inherit; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .doc { transition: none; } }
</style>
</head>
<body>

<main>
  <header>
    <div>

      <p class="meta">Attestations, relevés et certificats · Business Intelligence, IHEC Carthage</p>

  <nav aria-label="Sections">

  <footer>Cliquez sur un document pour l'afficher en grand.</footer>
</main>

<dialog id="viewer" aria-label="Document">
  <div class="bar"><span id="viewer-title"></span><button type="button" id="viewer-close">Fermer</button></div>
  <img id="viewer-img" alt="">
</dialog>

<script>
  const dlg = document.getElementById('viewer');
  const img = document.getElementById('viewer-img');
  const title = document.getElementById('viewer-title');
  document.querySelectorAll('button.doc').forEach(b => b.addEventListener('click', () => {
    img.src = b.dataset.src;
    img.alt = b.querySelector('img').alt;
    title.textContent = b.querySelector('strong').textContent;
    dlg.showModal();
  }));
  document.getElementById('viewer-close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
</script>
</body>
</html>
